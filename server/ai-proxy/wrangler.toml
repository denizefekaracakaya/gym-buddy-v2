# Cloudflare Worker for the Gym Buddy Gemini proxy.
# Deploy:   npx wrangler@4 deploy --config server/ai-proxy/wrangler.toml
# Secret:   npx wrangler@4 secret put GEMINI_API_KEY --config server/ai-proxy/wrangler.toml
name = "gym-buddy-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "gen-lang-client-0975287872"
ALLOWED_ORIGINS = "https://localhost,capacitor://localhost,http://localhost,http://localhost:3000"
GEMINI_TEXT_MODEL = "gemini-2.5-flash"
GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
RATE_PER_MINUTE = "10"
RATE_PER_DAY = "200"

[observability]
enabled = true
