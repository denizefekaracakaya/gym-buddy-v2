name: Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/android-mobile]
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  test:
    name: Typecheck, tests, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (calculators, parsers, data sync, AI edge function)
        run: npm test

      - name: Production web build
        # Supabase URL/publishable key are public defaults in supabase.config.ts.
        run: npm run build

      - name: Scan bundle for secrets / dev URLs
        run: npm run verify:bundle

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Android APK / AAB
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(node -p "require('./package.json').version")-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - APK will be signed with the runner's DEBUG key (testing only)."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Gradle build (release APK + AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='io.github.denizefekaracakaya.gymbuddy'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='${VERSION_NAME}'" "$RUNNER_TEMP/badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then echo "APK is debuggable" && exit 1; fi
          # The packaged web bundle must pass the same secret scan as dist/.
          # Extract the whole APK: unzip wildcards do not cross '/', so 'assets/public/*'
          # would only scan the top level and miss the JS bundles in assets/public/assets/.
          mkdir -p "$RUNNER_TEMP/apk" && unzip -q "$APK" -d "$RUNNER_TEMP/apk"
          test -n "$(ls "$RUNNER_TEMP"/apk/assets/public/assets/*.js)"
          node scripts/verify-bundle.mjs "$RUNNER_TEMP/apk/assets/public"

      - name: Collect artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p out
          BASE="GymBuddy-${VERSION_NAME}-${SIGNING}-signed"
          cp android/app/build/outputs/apk/release/app-release.apk "out/${BASE}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/${BASE}.aab"
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/signature.txt" out/
          echo "${GITHUB_SHA}" > out/COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gym-buddy-android-${{ steps.version.outputs.name }}
          path: out
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log-${{ github.run_number }}
          path: ${{ runner.temp }}/gradle.log
          retention-days: 7

  release:
    name: GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gym-buddy-android-${{ needs.android.outputs.version_name }}
          path: out

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(cat out/COMMIT.txt)" = "$GITHUB_SHA"
          NOTES=docs/release-notes/${TAG}.md
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/*.aab out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" out/*.apk out/*.aab out/SHA256SUMS.txt \
              --prerelease --verify-tag \
              --title "Gym Buddy ${TAG} — Android Beta" \
              --notes-file "$NOTES"
          fi
